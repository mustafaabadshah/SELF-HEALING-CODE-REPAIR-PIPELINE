version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: self_healing_backend
    ports:
      - "8000:8000"
    environment:
      - GROQ_API_KEY=${GROQ_API_KEY}
      - CODER_MODEL=${CODER_MODEL:-openai/gpt-oss-120b}
      - CRITIC_MODEL=${CRITIC_MODEL:-openai/gpt-oss-20b}
      - LANGFUSE_ENABLED=${LANGFUSE_ENABLED:-false}
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY}
      - LANGFUSE_HOST=${LANGFUSE_HOST:-https://cloud.langfuse.com}
      - MOCK_LLM=${MOCK_LLM:-false}
      - USE_DOCKER_SANDBOX=local
    volumes:
      - ./data:/app/data
      - ./workspaces:/app/workspaces
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: self_healing_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
